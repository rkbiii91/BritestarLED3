<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Brite Star LED — Install Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151b;
    --surface: #1b1f28;
    --surface-2: #232837;
    --line: #2b3140;
    --amber: #ffb13b;
    --amber-dim: #ffb13b33;
    --cyan: #4fd1e8;
    --text: #edeff3;
    --text-dim: #8b93a3;
    --danger: #ff6b6b;
    --good: #52d17c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 800px 400px at 50% -10%, #23283a 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    padding:24px 18px 60px;
    min-height:100vh;
  }
  .brand{
    text-align:center;
    margin-bottom:24px;
  }
  .brand-logo-wrap{
    background:#ffffff;
    border-radius:14px;
    padding:12px 22px;
    display:inline-block;
    box-shadow:0 4px 20px rgba(0,0,0,.25);
  }
  .brand-logo{
    width:160px;
    max-width:100%;
    height:auto;
    display:block;
  }
  .brand-sub{
    font-family:'Inter',sans-serif;
    font-size:11px;font-weight:600;color:var(--text-dim);
    margin:10px 0 0;text-transform:uppercase;letter-spacing:1.4px;
  }

  .ledstrip{display:flex;gap:6px;margin-bottom:26px;}
  .led{flex:1;height:5px;border-radius:3px;background:var(--surface-2);transition:.3s;}
  .led.on{background:var(--amber);box-shadow:0 0 10px var(--amber);}

  h2.title{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0 0 6px;}
  p.sub{color:var(--text-dim);font-size:14px;margin:0 0 22px;line-height:1.5;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
  }

  label{display:block;font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:600;}
  select, input[type=text], input[type=password], input[type=date], textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:13px 14px;
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    margin-bottom:16px;
    outline:none;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--amber);}
  input[type=date]{
    color-scheme:dark;
    display:block;
    width:100%;
    min-width:0;
    max-width:100%;
    height:46px;
    padding:0 14px;
    line-height:46px;
    font-size:15px;
    -webkit-appearance:none;
    appearance:none;
    text-align:left;
  }
  input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0;}
  input[type=date]::-webkit-datetime-edit{padding:0;}
  input[type=date]::-webkit-calendar-picker-indicator{opacity:.7;cursor:pointer;margin-left:6px;}
  textarea{resize:vertical;min-height:70px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    padding:14px 16px;
    border-radius:10px;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:.15s;
  }
  .btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  .btn-primary{background:var(--amber);color:#1a1300;}
  .btn-primary:hover{background:#ffc35f;}
  .btn-primary:disabled{background:#4a4330;color:#8a8270;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-dim);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid #ff6b6b44;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{width:auto;flex:1;}
  .btn-small{padding:9px 12px;font-size:13px;width:auto;}
  .link-btn{background:none;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;text-decoration:underline;padding:6px;}
  .link-btn:hover{color:var(--text);}

  .area-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .area-opt{
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:20px 10px;text-align:center;cursor:pointer;font-weight:600;font-size:14px;
    transition:.15s;
  }
  .area-opt:hover{border-color:var(--amber);}
  .area-opt.wide{grid-column:1/-1;}

  .fixture-card{
    padding:14px 0;border-bottom:1px solid var(--line);
  }
  .fixture-card:last-child{border-bottom:none;}
  .fixture-name{font-size:14.5px;font-weight:700;margin-bottom:10px;font-family:'Space Grotesk',sans-serif;}
  .fixture-field{margin-bottom:10px;}
  .fixture-field:last-child{margin-bottom:0;}
  .fixture-field label{font-size:10.5px;margin-bottom:5px;}
  .fixture-field-row{display:flex;gap:10px;margin-bottom:10px;}
  .fixture-field-row .fixture-field{flex:1;margin-bottom:0;}
  .fixture-field input[type=text]{margin-bottom:0;padding:10px 12px;font-size:14px;}
  .qty-wrap{display:flex;align-items:center;gap:6px;}
  .qty-btn{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--text);font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;
  }
  .qty-btn:hover{border-color:var(--amber);color:var(--amber);}
  .qty-input{
    width:40px;text-align:center;background:var(--surface-2);border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:5px 2px;font-family:'JetBrains Mono',monospace;
    font-weight:700;font-size:13px;margin:0;
  }

  .pill{
    display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;
    background:var(--amber-dim);color:var(--amber);font-weight:600;letter-spacing:.3px;
    margin-bottom:14px;
  }
  .pill.cyan{background:#4fd1e822;color:var(--cyan);}

  .confirm-icon{
    width:56px;height:56px;border-radius:50%;background:#52d17c22;color:var(--good);
    display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;
  }
  .center{text-align:center;}

  .top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .back-arrow{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;padding:4px 8px 4px 0;}
  .back-arrow:hover{color:var(--text);}

  .admin-tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px;}
  .save-bar{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);}
  .save-status{font-size:12.5px;color:var(--text-dim);margin-bottom:10px;text-align:center;min-height:18px;}
  .save-status.ok{color:var(--good);}
  .save-status.err{color:var(--danger);}
  .tab-btn{
    background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
    padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .tab-btn.active{background:var(--surface-2);color:var(--amber);border-color:var(--amber);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 6px;border-bottom:1px solid var(--line);}
  td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .muted{color:var(--text-dim);font-size:12.5px;}
  .empty-state{text-align:center;padding:30px 10px;color:var(--text-dim);font-size:13.5px;}
  .sub-tile{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;}
  .sub-tile-info{min-width:0;}
  .sub-tile-actions{display:flex;gap:8px;flex-shrink:0;}
  .loc-group{margin-bottom:22px;}
  .loc-group-header{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:0 2px 8px;border-bottom:1px solid var(--line);margin-bottom:10px;
  }
  .loc-group-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--amber);}
  .loc-group-count{font-size:11.5px;color:var(--text-dim);}
  .footer-note{text-align:center;color:var(--text-dim);font-size:11.5px;margin-top:28px;}
  .footer-note button{background:none;border:none;color:var(--text-dim);text-decoration:underline;cursor:pointer;font-size:11.5px;}
  ::-webkit-scrollbar{height:6px;}
  @media (max-width:380px){
    .area-grid{grid-template-columns:1fr;}
  }
</style>
</head>

let DATA = { publicLocations: [], locations: [], submissions: [], adminPassword: '', loadError: false };
let ADMIN_PW = '';
let state = { view: 'landing' };

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

async function api(path, options){
  options = options || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  const res = await fetch(path, Object.assign({}, options, { headers }));
  let body = null;
  try { body = await res.json(); } catch(e) {}
  if(!res.ok){
    const err = new Error((body && body.error) || ('Request failed (' + res.status + ')'));
    err.status = res.status;
    throw err;
  }
  return body;
}
function adminHeaders(){ return { 'x-admin-password': ADMIN_PW }; }

async function loadPublic(){
  const out = await api('/api/locations');
  DATA.publicLocations = out.locations || [];
  DATA.loadError = false;
}
async function loadAdminData(){
  const out = await api('/api/admin/data', { headers: adminHeaders() });
  DATA.locations = out.locations || [];
  DATA.submissions = out.submissions || [];
  DATA.adminPassword = out.adminPassword || '';
}
async function saveKey(key, value){
  try{
    await api('/api/admin/save', { method:'PUT', headers: adminHeaders(), body: JSON.stringify({ key, value }) });
    return true;
  }catch(e){
    console.error('save failed', key, e);
    alert('Could not save changes: ' + e.message);
    return false;
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = brand() + body();
  attachHandlers();
}

function brand(){
  return `
    <div class="brand">
      <div class="brand-logo-wrap">
        <img src="data:image/png;base64,${LOGO_B64}" alt="Brite Star LED EV" class="brand-logo">
      </div>
      <p class="brand-sub">Install Report</p>
    </div>
  `;
}

function ledStrip(activeCount, total){
  let dots = '';
  for(let i=0;i<total;i++){
    dots += `<div class="led ${i < activeCount ? 'on' : ''}"></div>`;
  }
  return `<div class="ledstrip">${dots}</div>`;
}

function body(){
  switch(state.view){
    case 'landing': return viewLanding();
    case 'select-location': return viewSelectLocation();
    case 'select-area': return viewSelectArea();
    case 'entry': return viewEntry();
    case 'confirm': return viewConfirm();
    case 'admin-login': return viewAdminLogin();
    case 'admin': return viewAdmin();
    default: return viewLanding();
  }
}

/* ---------- FIELD FLOW ---------- */

function viewLanding(){
  return `
    <h2 class="title">Job site report</h2>
    <p class="sub">Select your job location, log the LED fixtures you installed, and submit your count.</p>
    <button class="btn btn-primary" data-action="start-field">Start report</button>
    <div class="footer-note">Team access &middot; <button data-action="go-admin-login">Admin dashboard</button></div>
  `;
}

function viewSelectLocation(){
  const opts = DATA.publicLocations.map(l => `<option value="${l.id}">${escapeHtml(l.name)}</option>`).join('');
  return `
    ${ledStrip(1,3)}
    <h2 class="title">Where are you working?</h2>
    <p class="sub">Pick your job location and enter the site password your Brite Star contact gave you.</p>
    <div class="card">
      <label>Location</label>
      <select id="loc-select">${opts || `<option value="">${DATA.loadError ? 'Could not load locations' : 'No locations set up yet'}</option>`}</select>
      <label>Site password</label>
      <input type="password" id="loc-password" placeholder="Enter password" autocomplete="off">
      <div id="loc-error" style="color:var(--danger);font-size:13px;margin:-8px 0 12px;display:none;">Incorrect password for this location.</div>
      <button class="btn btn-primary" data-action="confirm-location" ${DATA.publicLocations.length===0 ? 'disabled':''}>Continue</button>
    </div>
    <button class="link-btn" data-action="go-landing">&larr; Back</button>
  `;
}

function viewSelectArea(){
  const loc = state.loc;
  const areaTypes = (loc && loc.areaTypes) || [];
  const opts = areaTypes.map((a,i) => `<div class="area-opt ${areaTypes.length % 2 === 1 && i === areaTypes.length-1 ? 'wide':''}" data-action="select-area" data-area="${escapeHtml(a)}">${escapeHtml(a)}</div>`).join('');
  return `
    ${ledStrip(2,3)}
    <div class="top-nav"><button class="back-arrow" data-action="go-select-location">&larr;</button></div>
    <span class="pill">${escapeHtml(loc ? loc.name : '')}</span>
    <h2 class="title">Which area?</h2>
    <p class="sub">Select the area you're reporting fixtures for.</p>
    <div class="area-grid">${opts || '<div class="empty-state wide" style="grid-column:1/-1;">No area types set up for this location yet. Ask Brite Star to add some in the admin dashboard.</div>'}</div>
  `;
}

function viewEntry(){
  const loc = state.loc;
  if(!state.qty) state.qty = {};
  if(!state.color) state.color = {};
  if(!state.watt) state.watt = {};
  if(!state.fixtureNotes) state.fixtureNotes = {};
  if(!state.reportDate) state.reportDate = new Date().toISOString().slice(0,10);

  const lightTypes = (loc && loc.lightTypes) || [];
  const rows = lightTypes.map(lt => {
    const val = state.qty[lt.id] || 0;
    const colorVal = state.color[lt.id] || '';
    const wattVal = state.watt[lt.id] || '';
    const noteVal = state.fixtureNotes[lt.id] || '';
    return `
      <div class="fixture-card">
        <div class="fixture-name">${escapeHtml(lt.name)}</div>

        <div class="fixture-field">
          <label>Quantity</label>
          <div class="qty-wrap">
            <button class="qty-btn" data-action="qty-dec" data-id="${lt.id}" type="button">&minus;</button>
            <input class="qty-input" type="text" inputmode="numeric" pattern="[0-9]*" data-id="${lt.id}" data-role="qty-input" value="${val}">
            <button class="qty-btn" data-action="qty-inc" data-id="${lt.id}" type="button">+</button>
          </div>
        </div>

        <div class="fixture-field-row">
          <div class="fixture-field">
            <label>Color</label>
            <input type="text" data-id="${lt.id}" data-role="color-input" placeholder="e.g. 4000K / White" value="${escapeHtml(colorVal)}">
          </div>
          <div class="fixture-field">
            <label>Power (Wattage)</label>
            <input type="text" data-id="${lt.id}" data-role="watt-input" placeholder="e.g. 40W" value="${escapeHtml(wattVal)}">
          </div>
        </div>

        <div class="fixture-field">
          <label>Note</label>
          <input type="text" data-id="${lt.id}" data-role="note-input" placeholder="Optional note for this fixture" value="${escapeHtml(noteVal)}">
        </div>
      </div>
    `;
  }).join('');

  return `
    ${ledStrip(3,3)}
    <div class="top-nav"><button class="back-arrow" data-action="go-select-area">&larr;</button></div>
    <span class="pill">${escapeHtml(loc ? loc.name : '')}</span>
    <span class="pill cyan">${escapeHtml(state.area)}</span>
    <h2 class="title">Log fixture counts</h2>
    <p class="sub">Enter how many of each fixture were installed in this area today.</p>

    <div class="card">
      <label>Your name</label>
      <input type="text" id="contractor-name" placeholder="e.g. Mike Torres" value="${escapeHtml(state.contractorName||'')}">
      <label>Date</label>
      <input type="date" id="report-date" value="${escapeHtml(state.reportDate)}">
    </div>

    <div class="card">
      ${rows || '<div class="empty-state">No fixture types set up yet. Ask Brite Star to add some in the admin dashboard.</div>'}
    </div>

function adminSubmissions(){
  const subs = [...DATA.submissions];
  if(subs.length === 0){
    return `<div class="card"><div class="empty-state">No submissions yet. They'll show up here as contractors log reports.</div></div>`;
  }

  // Group by location, most recently active location first
  const groups = {};
  subs.forEach(s => {
    if(!groups[s.locationName]) groups[s.locationName] = [];
    groups[s.locationName].push(s);
  });
  const locationNames = Object.keys(groups).sort((a,b) => {
    const latestA = Math.max(...groups[a].map(s => s.ts));
    const latestB = Math.max(...groups[b].map(s => s.ts));
    return latestB - latestA;
  });

  const groupsHtml = locationNames.map(locName => {
    const groupSubs = [...groups[locName]].sort((a,b) => b.ts - a.ts);
    const tiles = groupSubs.map(s => {
      const d = new Date(s.ts);
      const dateLabel = s.reportDate ? s.reportDate : d.toLocaleDateString();
      const confirming = state.confirmDeleteId === s.id;
      const actions = confirming ? `
          <div class="sub-tile-actions">
            <button class="btn btn-ghost btn-small" data-action="cancel-delete-submission">Cancel</button>
            <button class="btn btn-danger btn-small" data-action="confirm-delete-submission" data-id="${s.id}">Confirm delete</button>
          </div>
        ` : `
          <div class="sub-tile-actions">
            <button class="btn btn-ghost btn-small" data-action="export-submission-csv" data-id="${s.id}">CSV</button>
            <button class="btn btn-danger btn-small" data-action="delete-submission" data-id="${s.id}">Delete</button>
          </div>
        `;
      return `
        <div class="card sub-tile">
          <div class="sub-tile-info">
            <div style="font-weight:600;">${escapeHtml(s.area)}${s.emailed === false ? ' <span class="pill" style="background:#ff6b6b22;color:var(--danger);margin:0 0 0 6px;">email not sent</span>' : ''}</div>
            <div class="muted">${escapeHtml(s.contractorName)} &middot; ${escapeHtml(dateLabel)}</div>
          </div>
          ${actions}
        </div>
      `;
    }).join('');

    return `
      <div class="loc-group">
        <div class="loc-group-header">
          <span class="loc-group-name">${escapeHtml(locName)}</span>
          <span class="loc-group-count">${groupSubs.length} report${groupSubs.length===1?'':'s'}</span>
        </div>
        ${tiles}
      </div>
    `;
  }).join('');

  return `
    <button class="btn btn-ghost" style="margin-bottom:10px;" data-action="refresh-submissions">Refresh</button>
    <button class="btn btn-ghost" style="margin-bottom:14px;" data-action="export-csv">Export all as CSV (${subs.length} report${subs.length===1?'':'s'})</button>
    ${groupsHtml}
  `;
}

/* ---------- HANDLERS ---------- */

function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', onAction);
  });
  document.querySelectorAll('[data-role="qty-input"]').forEach(el => {
    el.addEventListener('input', (e) => {
      const id = e.target.dataset.id;
      let v = parseInt(e.target.value.replace(/[^0-9]/g,''), 10);
      if(isNaN(v) || v < 0) v = 0;
      state.qty[id] = v;
    });
    el.addEventListener('blur', (e) => { e.target.value = state.qty[e.target.dataset.id] || 0; });
  });
  document.querySelectorAll('[data-role="color-input"]').forEach(el => {
    el.addEventListener('input', (e) => { state.color[e.target.dataset.id] = e.target.value; });
  });
  document.querySelectorAll('[data-role="watt-input"]').forEach(el => {
    el.addEventListener('input', (e) => { state.watt[e.target.dataset.id] = e.target.value; });
  });
  document.querySelectorAll('[data-role="note-input"]').forEach(el => {
    el.addEventListener('input', (e) => { state.fixtureNotes[e.target.dataset.id] = e.target.value; });
  });
  const nameInput = document.getElementById('contractor-name');
  if(nameInput){
    nameInput.addEventListener('input', (e) => {
      state.contractorName = e.target.value;
      e.target.style.borderColor = '';
    });
  }
  const dateInput = document.getElementById('report-date');
  if(dateInput){
    const saveDate = (e) => { if(e.target.value) state.reportDate = e.target.value; };
    dateInput.addEventListener('input', saveDate);
    dateInput.addEventListener('change', saveDate);
  }
}

async function onAction(e){
  const action = e.currentTarget.dataset.action;

  if(action === 'start-field'){
    try{ await loadPublic(); }catch(err){ console.error(err); DATA.loadError = true; }
    state = {view:'select-location'};
    render();
  }
  else if(action === 'go-landing'){ state = {view:'landing'}; render(); }
  else if(action === 'go-select-location'){ state.view='select-location'; render(); }
  else if(action === 'go-select-area'){ state.view='select-area'; render(); }

  else if(action === 'confirm-location'){
    const sel = document.getElementById('loc-select');
    const pass = document.getElementById('loc-password').value;
    const errEl = document.getElementById('loc-error');
    errEl.style.display = 'none';
    if(!sel.value){ return; }
    try{
      const out = await api('/api/verify', { method:'POST', body: JSON.stringify({ locationId: sel.value, password: pass }) });
      state.loc = out.location;
      state.sitePassword = pass;
      state.view = 'select-area';
      render();
    }catch(err){
      errEl.textContent = err.status === 401 ? 'Incorrect password for this location.'
        : (err.status === 429 ? 'Too many attempts. Wait a minute and try again.'
        : 'Could not reach the server. Check your connection and try again.');
      errEl.style.display = 'block';
    }
  }

  else if(e.currentTarget.classList.contains('area-opt')){
    state.area = e.currentTarget.dataset.area;
    state.view = 'entry';
    render();
  }

  else if(action === 'qty-inc' || action === 'qty-dec'){
    const id = e.currentTarget.dataset.id;
    if(!state.qty) state.qty = {};
    let v = state.qty[id] || 0;
    v = action === 'qty-inc' ? v+1 : Math.max(0, v-1);
    state.qty[id] = v;
    const qtyBox = document.querySelector('[data-role="qty-input"][data-id="' + id + '"]');
    if(qtyBox) qtyBox.value = v; else render();
  }

  else if(action === 'submit-report'){
    const btn = e.currentTarget;
    const nameEl = document.getElementById('contractor-name');
    const errEl = document.getElementById('submit-error');
    const name = nameEl.value.trim();
    errEl.style.display = 'none';
    if(!name){
      nameEl.style.borderColor = 'var(--danger)';
      nameEl.focus();
      return;
    }
    state.contractorName = name;
    state.reportDate = document.getElementById('report-date').value || state.reportDate;
    if(!state.clientId) state.clientId = uid('c') + Date.now().toString(36);

    const loc = state.loc;
    const items = (loc.lightTypes || []).map(lt => ({
      name: lt.name,
      qty: (state.qty && state.qty[lt.id]) || 0,
      color: (state.color && state.color[lt.id]) || '',
      watt: (state.watt && state.watt[lt.id]) || '',
      note: (state.fixtureNotes && state.fixtureNotes[lt.id]) || ''
    }));

    btn.disabled = true;
    btn.textContent = 'Submitting…';
    try{
      await api('/api/submit', { method:'POST', body: JSON.stringify({
        clientId: state.clientId,
        locationId: loc.id,
        password: state.sitePassword,
        reportDate: state.reportDate,
        area: state.area,
        contractorName: name,
        items
      }) });
      const keptLoc = state.loc, keptPw = state.sitePassword;
      state = { view: 'confirm', keptLoc, keptPw };
      render();
    }catch(err){
      btn.disabled = false;
      btn.textContent = 'Submit report';
      errEl.textContent = err.status === 401
        ? 'Your site password is no longer valid. Go back and sign in again.'
        : 'Could not submit. Check your connection and try again — your entries are still here.';
      errEl.style.display = 'block';
    }
  }

  else if(action === 'submit-another-area'){
    state = { view: 'select-area', loc: state.keptLoc, sitePassword: state.keptPw };
    render();
  }

  else if(action === 'go-admin-login'){ state = {view:'admin-login'}; render(); }
  else if(action === 'confirm-admin'){
    const pass = document.getElementById('admin-password').value;
    const errEl = document.getElementById('admin-error');
    errEl.style.display = 'none';
    try{
      await api('/api/admin/login', { method:'POST', body: JSON.stringify({ password: pass }) });
      ADMIN_PW = pass;
      await loadAdminData();
      state = { view:'admin', adminTab:'submissions' };
      render();
    }catch(err){
      errEl.textContent = err.status === 401 ? 'Incorrect password.'
        : (err.status === 429 ? 'Too many attempts. Wait a minute and try again.' : 'Could not reach the server.');
      errEl.style.display = 'block';
    }
  }
  else if(action === 'admin-exit'){
    ADMIN_PW = '';
    DATA.locations = []; DATA.submissions = []; DATA.adminPassword = '';
    try{ await loadPublic(); }catch(err){ console.error(err); }
    state = {view:'landing'};
    render();
  }
  else if(action === 'admin-tab'){
    state.adminTab = e.currentTarget.dataset.tab;
    state.saveMsg = ''; state.saveOk = null;
    if(state.adminTab === 'submissions'){ try{ await loadAdminData(); }catch(err){ console.error(err); } }
    render();
  }
  else if(action === 'refresh-submissions'){
    try{ await loadAdminData(); }catch(err){ alert('Could not refresh: ' + err.message); }
    render();
  }

  else if(action === 'add-location'){
    const nameEl = document.getElementById('new-loc-name');
    const passEl = document.getElementById('new-loc-password');
    const name = nameEl.value.trim();
    const pass = passEl.value.trim();
    if(!name || !pass) return;
    DATA.locations.push({
      id: uid('loc'),
      name,
      password: pass,
      areaTypes: [...STARTER_AREA_TYPES],
      lightTypes: STARTER_LIGHT_TYPES.map(n => ({ id: uid('lt'), name: n }))
    });
    const ok = await saveKey('locations', DATA.locations);
    if(!ok){ try{ await loadAdminData(); }catch(err){} }
    try{ await loadPublic(); }catch(err){}
    render();
  }
  else if(action === 'delete-location'){
    DATA.locations = DATA.locations.filter(l => l.id !== e.currentTarget.dataset.id);
    const ok = await saveKey('locations', DATA.locations);
    if(!ok){ try{ await loadAdminData(); }catch(err){} }
    try{ await loadPublic(); }catch(err){}
    render();
  }

  else if(action === 'save-all'){
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = 'Saving…';
    state.saveMsg = ''; state.saveOk = null;
    const tab = state.adminTab || 'submissions';
    let problem = '';

    // Commit anything typed into an "add" form but not yet added
    if(tab === 'locations'){
      const name = (document.getElementById('new-loc-name').value || '').trim();
      const pass = (document.getElementById('new-loc-password').value || '').trim();
      if(name && pass){
        DATA.locations.push({
          id: uid('loc'), name, password: pass,
          areaTypes: [...STARTER_AREA_TYPES],
          lightTypes: STARTER_LIGHT_TYPES.map(n => ({ id: uid('lt'), name: n }))
        });
      } else if(name || pass){
        problem = 'To add a new location, enter both a name and a site password.';
      }
    } else if(tab === 'fixtures'){
      const el = document.getElementById('new-fixture-name');
      const loc = DATA.locations.find(l => l.id === state.adminFixtureLocationId);
      const name = el ? el.value.trim() : '';
      if(name && loc){
        if(!Array.isArray(loc.lightTypes)) loc.lightTypes = [];
        loc.lightTypes.push({ id: uid('lt'), name });
      }
    } else if(tab === 'areas'){
      const el = document.getElementById('new-area-name');
      const loc = DATA.locations.find(l => l.id === state.adminAreaLocationId);
      const name = el ? el.value.trim() : '';
      if(name && loc){
        if(!Array.isArray(loc.areaTypes)) loc.areaTypes = [];
        loc.areaTypes.push(name);
      }
    }

    let ok = !problem;
    if(ok){
      ok = await saveKey('locations', DATA.locations);
    }
    if(ok && tab === 'settings'){
      const pw = (document.getElementById('new-admin-password').value || '').trim();
      if(pw){
        const pwOk = await saveKey('adminPassword', pw);
        if(pwOk){ ADMIN_PW = pw; } else { ok = false; }
      }
    }
    if(ok){
      // Reload from the server so the screen shows exactly what is stored
      try{
        await loadAdminData();
        await loadPublic();
        const t = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
        state.saveMsg = 'Saved ✓ ' + t;
        state.saveOk = true;
      }catch(err){
        state.saveMsg = 'Saved, but could not refresh the view. Tap Refresh or reload the page.';
        state.saveOk = false;
      }
    } else {
      state.saveMsg = problem || 'Save failed. Check your connection and try again.';
      state.saveOk = false;
    }
    render();
  }

  else if(action === 'pick-fixture-location'){
    state.adminFixtureLocationId = e.currentTarget.dataset.id;
    render();
  }
  else if(action === 'change-fixture-location'){
    state.adminFixtureLocationId = null;
    render();
  }
  else if(action === 'add-fixture'){
    const nameEl = document.getElementById('new-fixture-name');
    const name = nameEl.value.trim();
    if(!name) return;
    const loc = DATA.locations.find(l => l.id === state.adminFixtureLocationId);
    if(!loc) return;
    if(!Array.isArray(loc.lightTypes)) loc.lightTypes = [];
    loc.lightTypes.push({ id: uid('lt'), name });
    await saveKey('locations', DATA.locations);
    render();
  }
  else if(action === 'delete-fixture'){
    const loc = DATA.locations.find(l => l.id === state.adminFixtureLocationId);
    if(!loc) return;
    loc.lightTypes = (loc.lightTypes || []).filter(l => l.id !== e.currentTarget.dataset.id);
    await saveKey('locations', DATA.locations);
    render();
  }

  else if(action === 'pick-area-location'){
    state.adminAreaLocationId = e.currentTarget.dataset.id;
    render();
  }
  else if(action === 'change-area-location'){
    state.adminAreaLocationId = null;
    render();
  }
  else if(action === 'add-area'){
    const nameEl = document.getElementById('new-area-name');
    const name = nameEl.value.trim();
    if(!name) return;
    const loc = DATA.locations.find(l => l.id === state.adminAreaLocationId);
    if(!loc) return;
    if(!Array.isArray(loc.areaTypes)) loc.areaTypes = [];
    loc.areaTypes.push(name);
    await saveKey('locations', DATA.locations);
    render();
  }
  else if(action === 'delete-area'){
    const loc = DATA.locations.find(l => l.id === state.adminAreaLocationId);
    if(!loc) return;
    const idx = parseInt(e.currentTarget.dataset.idx, 10);
    loc.areaTypes.splice(idx,1);
    await saveKey('locations', DATA.locations);
    render();
  }

  else if(action === 'change-admin-password'){
    const val = document.getElementById('new-admin-password').value.trim();
    if(!val) return;
    const ok = await saveKey('adminPassword', val);
    if(ok){ ADMIN_PW = val; DATA.adminPassword = val; }
    render();
  }

  else if(action === 'export-csv'){
    exportCsv();
  }
  else if(action === 'export-submission-csv'){
    exportSingleCsv(e.currentTarget.dataset.id);
  }
  else if(action === 'delete-submission'){
    state.confirmDeleteId = e.currentTarget.dataset.id;
    render();
  }
  else if(action === 'cancel-delete-submission'){
    state.confirmDeleteId = null;
    render();
  }
  else if(action === 'confirm-delete-submission'){
    const id = e.currentTarget.dataset.id;
    try{
      await api('/api/admin/submissions/' + encodeURIComponent(id), { method:'DELETE', headers: adminHeaders() });
      DATA.submissions = DATA.submissions.filter(s => s.id !== id);
    }catch(err){
      alert('Could not delete: ' + err.message);
    }
    state.confirmDeleteId = null;
    render();
  }
}

function buildCsvRows(subs){
  const rows = [['Date','Submitted At','Contractor','Location','Area','Fixture Type','Quantity','Color','Wattage','Fixture Note']];
  subs.forEach(s => {
    const d = new Date(s.ts);
    const dateStr = s.reportDate || d.toLocaleDateString();
    const timeStr = d.toLocaleTimeString();
    const activeItems = s.items.filter(i => i.qty > 0);
    if(activeItems.length === 0){
      rows.push([dateStr,timeStr,s.contractorName,s.locationName,s.area,'','0','','','']);
    } else {
      activeItems.forEach(i => {
        rows.push([dateStr,timeStr,s.contractorName,s.locationName,s.area,i.name,String(i.qty),i.color||'',i.watt||'',i.note||'']);
      });
    }
  });
  return rows;
}

function downloadCsv(rows, filename){
  const csv = rows.map(r => r.map(cell => {
    const c = String(cell).replace(/"/g,'""');
    return /[",\n]/.test(c) ? `"${c}"` : c;
  }).join(',')).join('\n');

  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCsv(){
  const subs = [...DATA.submissions].sort((a,b)=>a.ts-b.ts);
  downloadCsv(buildCsvRows(subs), `brite-star-led-submissions-${new Date().toISOString().slice(0,10)}.csv`);
}

function exportSingleCsv(id){
  const sub = DATA.submissions.find(s => s.id === id);
  if(!sub) return;
  const safeLocation = sub.locationName.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  const dateForFile = sub.reportDate || new Date(sub.ts).toISOString().slice(0,10);
  downloadCsv(buildCsvRows([sub]), `brite-star-led-${safeLocation}-${dateForFile}.csv`);
}

(async function init(){
  document.getElementById('app').innerHTML = brand() + '<p class="sub">Loading…</p>';
  try{ await loadPublic(); }catch(e){ console.error(e); DATA.loadError = true; }
  render();
})();
</script>
