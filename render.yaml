# Render Blueprint — optional. You can also create the service by hand (see README).
# Recommended setup: Starter instance + 1 GB persistent disk.
services:
  - type: web
    name: brite-star-install-report
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: MAIL_TO
        value: rb@britestar.com, care@britestar.com, rk@britestar.com
      - key: MAIL_FROM
        value: britestarledev@gmail.com
      - key: DISPLAY_TZ
        value: America/New_York
      - key: ADMIN_PASSWORD
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
